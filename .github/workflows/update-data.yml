name: Update tax sale data

on:
  schedule:
    - cron: "23 13 1 * *"   # monthly, the 1st at about 6:23 AM Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "sources/*.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch every source and rebuild the registry
        run: python fetch_all.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update tax sale data $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
