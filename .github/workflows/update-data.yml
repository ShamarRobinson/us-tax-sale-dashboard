name: Update tax sale data

on:
  schedule:
    - cron: "23 13 1 * *"   # monthly, the 1st at about 6:23 AM Pacific
  workflow_dispatch:
    inputs:
      recrawl_links:
        description: "Recrawl every county website for sale links (not just stale ones)"
        type: boolean
        default: false
      send_test_email:
        description: "Send a test alert digest"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "*.py"
      - "sources/*.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find sale links on county websites (counties not checked in the last 45 days)
        run: |
          if [ "${{ inputs.recrawl_links }}" = "true" ]; then python discover_links.py --stale 0 --threads 24; else python discover_links.py --threads 24; fi
      - name: Fetch every source, rebuild the registry and the master CSV
        run: python fetch_all.py
      - name: Email the digest of newly posted and upcoming sales (only when alert secrets are set)
        if: github.event_name != 'push'
        env:
          ALERT_TO: ${{ secrets.ALERT_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ALERT_STATES: ${{ secrets.ALERT_STATES }}
          ALERT_TEST: ${{ inputs.send_test_email }}
        run: python notify.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The fetch can take two hours and main moves meanwhile (portal data pushed from the Mac), and the derived
          # files never merge cleanly. So: keep this run's output aside, take main as the base, lay this run's county
          # files on top except where main changed a county since the run began, rebuild the derived files from that
          # union, and push; retry if main moves again in between.
          START=$(git rev-parse HEAD)
          rm -rf /tmp/run && mkdir -p /tmp/run && cp -r data /tmp/run/data && cp ref/discovered_links.json /tmp/run/
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            git diff --name-only "$START" origin/main -- data/counties data/raw ref/discovered_links.json | sort > /tmp/run/main_changed.txt
            for f in /tmp/run/data/counties/*.json; do
              rel="data/counties/$(basename "$f")"
              grep -qx "$rel" /tmp/run/main_changed.txt || cp "$f" "$rel"
            done
            grep -qx ref/discovered_links.json /tmp/run/main_changed.txt || cp /tmp/run/discovered_links.json ref/discovered_links.json
            cp /tmp/run/data/index.json data/index.json   # carries this run's source status into the rebuild
            python fetch_all.py --offline
            git add data/ ref/discovered_links.json
            if git diff --cached --quiet; then
              echo "No changes"
              exit 0
            fi
            git commit -q -m "Update tax sale data $(date -u +%Y-%m-%d)"
            if git push; then
              exit 0
            fi
            echo "main moved during the rebuild (attempt $attempt), retrying"
          done
          exit 1
